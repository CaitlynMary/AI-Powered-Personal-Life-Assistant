<div
  class="fixed inset-0 z-[70] flex items-center justify-center overflow-y-auto bg-plum/45 p-4 backdrop-blur-sm"
>
  <section
    class="my-auto max-h-[calc(100dvh-2rem)] w-full max-w-2xl overflow-y-auto rounded-3xl bg-ls-surface p-5 shadow-card sm:p-7"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="goal() ? 'Edit goal' : 'Create goal'"
  >
    <div class="mb-5 flex items-start justify-between gap-4">
      <div>
        <p class="text-xs font-extrabold uppercase tracking-[0.14em] text-purple">Goals</p>
        <h2 class="mt-1 text-2xl font-extrabold text-plum dark:text-cream">
          {{ goal() ? 'Edit goal' : 'Create a goal' }}
        </h2>
      </div>
      <button
        type="button"
        class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-xl leading-none text-ls-text-muted transition hover:bg-ls-bg hover:text-ls-text focus-visible:outline focus-visible:outline-2 focus-visible:outline-navy"
        aria-label="Close"
        (click)="cancel.emit()"
      >
        ×
      </button>
    </div>

    @if (requestError()) {
      <p class="mb-4 rounded-2xl bg-ls-surface-2 px-4 py-3 text-sm font-semibold text-ls-text" role="alert">
        {{ requestError() }}
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <label class="block">
        <span class="mb-1.5 block text-sm font-bold text-ls-text">Goal title *</span>
        <input
          formControlName="title"
          maxlength="150"
          class="h-11 w-full rounded-xl border border-ls-border bg-ls-input px-3 text-sm text-ls-text"
          placeholder="What would you like to achieve?"
        />
        @if (form.controls.title.touched && form.controls.title.hasError('required')) {
          <span class="mt-1 block text-xs font-semibold text-burgundy"
            >A non-empty goal title is required.</span
          >
        } @else if (form.controls.title.touched && form.controls.title.hasError('maxlength')) {
          <span class="mt-1 block text-xs font-semibold text-burgundy"
            >Title cannot exceed 150 characters.</span
          >
        }
      </label>

      <label class="block">
        <span class="mb-1.5 block text-sm font-bold text-ls-text">Description</span>
        <textarea
          formControlName="description"
          maxlength="2000"
          rows="3"
          class="w-full rounded-xl border border-ls-border bg-ls-input px-3 py-2 text-sm text-ls-text"
          placeholder="Add a little more detail (optional)"
        ></textarea>
        @if (form.controls.description.touched && form.controls.description.hasError('maxlength')) {
          <span class="mt-1 block text-xs font-semibold text-burgundy"
            >Description cannot exceed 2,000 characters.</span
          >
        }
      </label>

      <label class="block">
        <span class="mb-1.5 block text-sm font-bold text-ls-text">Goal type *</span>
        <select
          formControlName="goalType"
          class="h-11 w-full rounded-xl border border-ls-border bg-ls-input px-3 text-sm text-ls-text"
        >
          <option value="WEEKLY">Weekly</option>
          <option value="MONTHLY">Monthly</option>
          <option value="YEARLY">Yearly</option>
        </select>
      </label>

      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block">
          <span class="mb-1.5 block text-sm font-bold text-ls-text">Start date *</span>
          <input
            type="date"
            formControlName="startDate"
            class="h-11 w-full rounded-xl border border-ls-border bg-ls-input px-3 text-sm text-ls-text"
          />
          @if (form.controls.startDate.touched && form.controls.startDate.hasError('required')) {
            <span class="mt-1 block text-xs font-semibold text-burgundy"
              >Start date is required.</span
            >
          }
        </label>
        <label class="block">
          <span class="mb-1.5 block text-sm font-bold text-ls-text">Target date *</span>
          <input
            type="date"
            formControlName="targetDate"
            class="h-11 w-full rounded-xl border border-ls-border bg-ls-input px-3 text-sm text-ls-text"
          />
          @if (form.controls.targetDate.touched && form.controls.targetDate.hasError('required')) {
            <span class="mt-1 block text-xs font-semibold text-burgundy"
              >Target date is required.</span
            >
          }
        </label>
      </div>
      @if (
        form.hasError('targetBeforeStart') &&
        (form.controls.startDate.touched || form.controls.targetDate.touched)
      ) {
        <p class="-mt-2 text-xs font-semibold text-burgundy" role="alert">
          Target date must be on or after the start date.
        </p>
      }

      <div class="flex flex-col-reverse justify-end gap-3 pt-2 sm:flex-row">
        <button
          type="button"
          class="rounded-xl border border-ls-border px-5 py-3 text-sm font-bold text-ls-text"
          (click)="cancel.emit()"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="rounded-xl bg-lime px-5 py-3 text-sm font-extrabold text-plum transition hover:bg-mint disabled:cursor-wait disabled:opacity-60"
          [disabled]="saving()"
        >
          {{ saving() ? 'Saving…' : goal() ? 'Save changes' : 'Create goal' }}
        </button>
      </div>
    </form>
  </section>
</div>
