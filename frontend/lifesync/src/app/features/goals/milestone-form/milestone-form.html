<div
  class="fixed inset-0 z-[80] flex items-center justify-center overflow-y-auto bg-plum/45 p-4 backdrop-blur-sm"
>
  <section
    class="my-auto max-h-[calc(100dvh-2rem)] w-full max-w-xl overflow-y-auto rounded-3xl bg-ls-surface p-5 shadow-card sm:p-7"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="milestone() ? 'Edit milestone' : 'Create milestone'"
  >
    <div class="mb-5 flex items-start justify-between gap-4">
      <div>
        <p class="text-xs font-extrabold uppercase tracking-[0.14em] text-purple">Milestones</p>
        <h2 class="mt-1 text-2xl font-extrabold text-plum dark:text-cream">
          {{ milestone() ? 'Edit milestone' : 'Add a milestone' }}
        </h2>
        <p class="mt-1 text-xs text-ls-text-muted">
          Choose a target date between {{ goalStartDate() }} and {{ goalTargetDate() }}.
        </p>
      </div>
      <button
        type="button"
        class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-xl leading-none text-ls-text-muted transition hover:bg-ls-bg hover:text-ls-text focus-visible:outline focus-visible:outline-2 focus-visible:outline-navy"
        aria-label="Close"
        (click)="cancel.emit()"
      >
        ×
      </button>
    </div>

    @if (requestError()) {
      <p class="mb-4 rounded-2xl bg-ls-surface-2 px-4 py-3 text-sm font-semibold text-ls-text" role="alert">
        {{ requestError() }}
      </p>
    }
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <label class="block">
        <span class="mb-1.5 block text-sm font-bold text-ls-text">Milestone title *</span>
        <input
          formControlName="title"
          maxlength="150"
          class="h-11 w-full rounded-xl border border-ls-border bg-ls-input px-3 text-sm text-ls-text"
          placeholder="A measurable step"
        />
        @if (form.controls.title.touched && form.controls.title.hasError('required')) {
          <span class="mt-1 block text-xs font-semibold text-burgundy"
            >A non-empty milestone title is required.</span
          >
        } @else if (form.controls.title.touched && form.controls.title.hasError('maxlength')) {
          <span class="mt-1 block text-xs font-semibold text-burgundy"
            >Title cannot exceed 150 characters.</span
          >
        }
      </label>
      <label class="block">
        <span class="mb-1.5 block text-sm font-bold text-ls-text">Description</span>
        <textarea
          formControlName="description"
          maxlength="2000"
          rows="3"
          class="w-full rounded-xl border border-ls-border bg-ls-input px-3 py-2 text-sm text-ls-text"
        ></textarea>
        @if (form.controls.description.touched && form.controls.description.hasError('maxlength')) {
          <span class="mt-1 block text-xs font-semibold text-burgundy"
            >Description cannot exceed 2,000 characters.</span
          >
        }
      </label>
      <label class="block">
        <span class="mb-1.5 block text-sm font-bold text-ls-text">Target date *</span>
        <input
          type="date"
          formControlName="targetDate"
          [min]="goalStartDate()"
          [max]="goalTargetDate()"
          class="h-11 w-full rounded-xl border border-ls-border bg-ls-input px-3 text-sm text-ls-text"
        />
        @if (form.controls.targetDate.touched && form.controls.targetDate.hasError('required')) {
          <span class="mt-1 block text-xs font-semibold text-burgundy"
            >Target date is required.</span
          >
        } @else if (
          form.controls.targetDate.touched && form.controls.targetDate.hasError('outsideGoalRange')
        ) {
          <span class="mt-1 block text-xs font-semibold text-burgundy"
            >Target date must be within the goal date range.</span
          >
        }
      </label>
      <div class="flex flex-col-reverse justify-end gap-3 pt-2 sm:flex-row">
        <button
          type="button"
          class="rounded-xl border border-ls-border px-5 py-3 text-sm font-bold text-ls-text"
          (click)="cancel.emit()"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="rounded-xl bg-lime px-5 py-3 text-sm font-extrabold text-plum transition hover:bg-mint disabled:opacity-60"
          [disabled]="saving()"
        >
          {{ saving() ? 'Saving…' : milestone() ? 'Save changes' : 'Create milestone' }}
        </button>
      </div>
    </form>
  </section>
</div>
