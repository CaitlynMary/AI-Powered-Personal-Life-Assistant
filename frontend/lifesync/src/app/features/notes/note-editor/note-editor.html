<div
  class="fixed inset-0 z-[70] flex items-center justify-center overflow-y-auto bg-plum/45 p-3 backdrop-blur-sm sm:p-6"
>
  <section
    class="my-auto max-h-[92dvh] w-full max-w-2xl overflow-y-auto rounded-[2rem] border border-ls-border bg-ls-surface p-5 shadow-[0_24px_80px_-28px_rgba(23,39,73,.16)] sm:p-8"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="
      mode() === 'VIEW' ? 'View note' : mode() === 'EDIT' ? 'Edit note' : 'Create note'
    "
  >
    <div class="mb-5 flex items-start justify-between gap-4">
      <div>
        <p class="font-quote text-xl font-semibold text-orchid">
          {{
            mode() === 'VIEW'
              ? 'A little keepsake'
              : mode() === 'EDIT'
                ? 'Freshen your page'
                : 'A new little thought'
          }}
        </p>
        <h2 class="mt-1 text-2xl font-extrabold text-plum dark:text-cream">
          {{ mode() === 'VIEW' ? 'Your note' : mode() === 'EDIT' ? 'Edit note' : 'Create a note' }}
        </h2>
      </div>
      <button
        type="button"
        class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-xl leading-none text-ls-text-muted transition hover:bg-ls-surface-2 hover:text-plum focus-visible:outline focus-visible:outline-2 focus-visible:outline-navy"
        aria-label="Close note"
        (click)="close.emit()"
      >
        ×
      </button>
    </div>

    @if (requestError(); as message) {
      <p
        class="mb-4 rounded-xl bg-ls-surface-2 px-4 py-3 text-sm font-semibold text-plum"
        role="alert"
      >
        {{ message }}
      </p>
    }

    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block">
        <span class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-plum"
          >Title</span
        >
        <input
          type="text"
          formControlName="title"
          maxlength="200"
          [readonly]="mode() === 'VIEW'"
          placeholder="Give this thought a name…"
          class="w-full rounded-xl border border-ls-border bg-ls-input px-4 py-3 text-sm text-plum placeholder:text-ls-text-muted focus:border-navy"
        />
        @if (form.controls.title.touched && form.controls.title.invalid) {
          <span class="mt-1 block text-xs font-semibold text-burgundy">
            @if (form.controls.title.hasError('required')) {
              Add a title for your note.
            } @else if (form.controls.title.hasError('maxlength')) {
              The title must be 200 characters or fewer.
            }
          </span>
        }
      </label>

      <label class="block">
        <span class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-plum"
          >Your thoughts</span
        >
        <textarea
          rows="11"
          formControlName="content"
          maxlength="50000"
          [readonly]="mode() === 'VIEW'"
          placeholder="Write whatever is on your mind…"
          class="min-h-64 w-full resize-y rounded-xl border border-ls-border bg-ls-input px-4 py-3 text-sm leading-7 text-plum placeholder:text-ls-text-muted focus:border-navy"
        ></textarea>
        <span class="mt-1 block text-right text-[11px] text-ls-text-muted">
          {{ form.controls.content.value.length }} / 50,000
        </span>
        @if (form.controls.content.touched && form.controls.content.invalid) {
          <span class="block text-xs font-semibold text-burgundy">
            @if (form.controls.content.hasError('required')) {
              Write a little something before saving.
            } @else if (form.controls.content.hasError('maxlength')) {
              Note content must be 50,000 characters or fewer.
            }
          </span>
        }
      </label>

      <div class="flex flex-wrap justify-end gap-2 border-t border-ls-border pt-4">
        @if (mode() === 'VIEW') {
          <button
            type="button"
            class="rounded-xl bg-ls-surface-2 px-4 py-2.5 text-sm font-bold text-plum hover:bg-ls-surface-2"
            (click)="editRequested.emit()"
          >
            Edit note
          </button>
          <button
            type="button"
            class="rounded-xl bg-orchid px-5 py-2.5 text-sm font-extrabold text-white hover:bg-plum"
            (click)="close.emit()"
          >
            Done
          </button>
        } @else {
          <button
            type="button"
            class="rounded-xl border border-ls-border px-4 py-2.5 text-sm font-bold text-plum hover:bg-ls-surface"
            [disabled]="saving()"
            (click)="close.emit()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="rounded-xl bg-lime px-5 py-2.5 text-sm font-extrabold text-plum shadow-sm hover:bg-mint disabled:opacity-60"
            [disabled]="saving()"
          >
            {{ saving() ? 'Saving…' : mode() === 'EDIT' ? 'Save changes' : 'Save note' }}
          </button>
        }
      </div>
    </form>
  </section>
</div>
