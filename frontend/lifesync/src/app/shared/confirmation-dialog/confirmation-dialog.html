@if (confirmation.options(); as options) {
  <div
    class="confirmation-backdrop"
    role="presentation"
    (click)="dismissOnBackdrop($event)"
  >
    <section
      #dialog
      class="confirmation-panel"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirmation-title"
      aria-describedby="confirmation-message"
      tabindex="-1"
      (keydown)="handleKeydown($event)"
    >
      <div class="confirmation-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M4.5 7h15M9 7V4.5h6V7m-8.5 0 1 13h9l1-13M10 10.5v6m4-6v6"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.7"
          />
        </svg>
        <span></span>
      </div>
      <p class="confirmation-eyebrow">Just checking</p>
      <h2 id="confirmation-title">{{ options.title }}</h2>
      <p id="confirmation-message">{{ options.message }}</p>
      @if (confirmation.actionError(); as error) {
        <p class="confirmation-error" role="alert">{{ error }}</p>
      }
      <div class="confirmation-actions">
        <button
          #cancelButton
          type="button"
          class="confirmation-cancel"
          [disabled]="confirmation.actionPending()"
          (click)="confirmation.answer(false)"
        >
          Cancel
        </button>
        <button
          type="button"
          class="confirmation-confirm"
          [disabled]="confirmation.actionPending()"
          (click)="confirmation.answer(true)"
        >
          {{ confirmation.actionPending() ? 'Working…' : options.confirmLabel }}
        </button>
      </div>
    </section>
  </div>
}
