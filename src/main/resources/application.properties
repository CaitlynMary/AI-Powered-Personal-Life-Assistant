spring.application.name=lifesync
# Keep existing local databases off Flyway unless a deployment profile is explicitly selected.
spring.profiles.default=local
server.port=${PORT:8080}

# ==================================
# POSTGRESQL DATABASE CONFIGURATION
# ==================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lifesync_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

spring.datasource.driver-class-name=org.postgresql.Driver

# ==================================
# JPA / HIBERNATE CONFIGURATION
# ==================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.flyway.enabled=true

# Authentication secrets must be supplied by the deployment environment.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}


spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.timeout=60s
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1
